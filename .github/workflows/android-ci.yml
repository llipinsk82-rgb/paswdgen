name: Android CI

on:
  push:
    branches:
      - agent/android-vault-mvp
    paths:
      - app/**
      - .github/workflows/android-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - .github/workflows/android-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autofill-wiring-agent
  cancel-in-progress: false

jobs:
  patch-autofill:
    name: Wire Autofill generator and SPA recovery
    if: github.ref == 'refs/heads/agent/android-vault-mvp' || github.head_ref == 'agent/android-vault-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-vault-mvp
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_bin}" ]]; then
            sdkmanager_bin="$(find "${android_home}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          yes | "${sdkmanager_bin}" --licenses >/dev/null || true
          "${sdkmanager_bin}" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Patch service and version when needed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          service = Path("app/src/main/java/com/blackserv/passwdgen/PasswdGenAutofillService.kt")
          build = Path("app/build.gradle.kts")
          text = service.read_text()

          if "buildGeneratedPasswordDataset" not in text:
              import_anchor = "import android.widget.RemoteViews\n"
              if text.count(import_anchor) != 1:
                  raise SystemExit("RemoteViews import anchor missing")
              service.write_text(
                  text.replace(
                      import_anchor,
                      import_anchor + "import android.view.autofill.AutofillValue\n",
                      1,
                  )
              )
              replace_once(
                  str(service),
                  "        val sessionForm = AutofillSessionPolicy.merge(\n            forms = analyses.mapNotNull(AutofillParseResult::form),\n            current = form,\n        )\n        val authenticationIntent",
                  "        val sessionForm = AutofillSessionPolicy.merge(\n            forms = analyses.mapNotNull(AutofillParseResult::form),\n            current = form,\n        )\n        val saveForm = sessionForm.copy(\n            submitId = sessionForm.submitId ?: AutofillSpaSubmitPolicy.find(\n                contexts.map { context -> context.structure },\n            ),\n        )\n        val authenticationIntent",
              )
              replace_once(
                  str(service),
                  "                session = sessionForm,",
                  "                session = saveForm,",
              )
              replace_once(
                  str(service),
                  "        val response = FillResponse.Builder()\n            .addDataset(lockedDataset)\n            .setClientState(session.toBundle())\n        buildSaveInfo(sessionForm)?.let(response::setSaveInfo)",
                  "        val response = FillResponse.Builder()\n            .addDataset(lockedDataset)\n            .setClientState(session.toBundle())\n        buildGeneratedPasswordDataset(form, targetDetail)?.let(response::addDataset)\n        buildSaveInfo(saveForm)?.let(response::setSaveInfo)",
              )
              replace_once(
                  str(service),
                  "    private fun buildSaveInfo(form: AutofillSessionForm): SaveInfo? {",
                  "    private fun buildGeneratedPasswordDataset(\n        form: AutofillForm,\n        targetDetail: String,\n    ): Dataset? {\n        val passwordId = form.passwordId ?: return null\n        val generatedPassword = AutofillGeneratedPasswordPolicy.generate()\n        val presentation = RemoteViews(packageName, R.layout.autofill_presentation).apply {\n            setTextViewText(R.id.autofill_primary, \"Wygeneruj silne hasło\")\n            setTextViewText(\n                R.id.autofill_secondary,\n                \"${AutofillGeneratedPasswordPolicy.LENGTH} znaków • $targetDetail\",\n            )\n        }\n        return Dataset.Builder(presentation).apply {\n            val value = AutofillValue.forText(generatedPassword)\n            setValue(passwordId, value, presentation)\n            form.confirmationPasswordId\n                ?.takeIf { confirmationId -> confirmationId != passwordId }\n                ?.let { confirmationId -> setValue(confirmationId, value, presentation) }\n            setId(\"passwdgen-generated\")\n        }.build()\n    }\n\n    private fun buildSaveInfo(form: AutofillSessionForm): SaveInfo? {",
              )

          build_text = build.read_text()
          if '"0.1.13"' in build_text:
              replace_once(
                  str(build),
                  '?: if (versionCodeProperty == null) 23 else error("passwdgen.versionCode must be a positive integer")',
                  '?: if (versionCodeProperty == null) 24 else error("passwdgen.versionCode must be a positive integer")',
              )
              replace_once(
                  str(build),
                  '?: if (versionNameProperty == null) "0.1.13" else error("passwdgen.versionName must not be blank")',
                  '?: if (versionNameProperty == null) "0.1.14" else error("passwdgen.versionName must not be blank")',
              )
          elif '"0.1.14"' not in build_text:
              raise SystemExit("Unexpected app version")
          PY

      - name: Verify implementation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Commit implementation when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Implementation already wired; no commit needed."
            exit 0
          fi
          git config user.name "blackserv-actions"
          git config user.email "actions@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/blackserv/passwdgen/PasswdGenAutofillService.kt
          git commit -m "Wire Autofill password generator and SPA save trigger"
          git push origin HEAD:agent/android-vault-mvp
