name: Android CI

on:
  push:
    branches:
      - agent/android-vault-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Generate and verify Gradle Wrapper
        shell: bash
        run: bash scripts/bootstrap-gradle-wrapper.sh

      - name: Verify wrapper configuration
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          grep -F "distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78" \
            gradle/wrapper/gradle-wrapper.properties

      - name: Run unit tests
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload verified wrapper, APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-output
          if-no-files-found: warn
          retention-days: 7
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
