name: Android CI

on:
  push:
    branches:
      - agent/android-vault-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${android_home}" ]]; then
            echo "ERROR: ANDROID_SDK_ROOT and ANDROID_HOME are not set." >&2
            exit 1
          fi

          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_bin}" ]]; then
            sdkmanager_bin="$(find "${android_home}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "${sdkmanager_bin}" || ! -x "${sdkmanager_bin}" ]]; then
            echo "ERROR: sdkmanager not found in Android SDK: ${android_home}" >&2
            exit 1
          fi

          yes | "${sdkmanager_bin}" --licenses >/dev/null || true
          "${sdkmanager_bin}" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

          test -d "${android_home}/platforms/android-36"

      - name: Verify committed Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x gradlew
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check --strict
          grep -Fx "distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78" \
            gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/ci-logs
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 \
            | tee app/build/ci-logs/unit-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/ci-logs
          ./gradlew --no-daemon --stacktrace lintDebug 2>&1 \
            | tee app/build/ci-logs/lint.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/ci-logs
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 \
            | tee app/build/ci-logs/assemble.log

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-ci-output
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/ci-logs/**
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
