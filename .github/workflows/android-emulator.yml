name: Android emulator smoke

on:
  push:
    branches:
      - agent/android-vault-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android emulator image
        id: android-sdk
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          set -euo pipefail
          android_home="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${android_home}" ]]; then
            echo "ERROR: ANDROID_SDK_ROOT and ANDROID_HOME are not set." >&2
            exit 1
          fi

          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_bin}" ]]; then
            sdkmanager_bin="$(find "${android_home}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          avdmanager_bin="$(command -v avdmanager || true)"
          if [[ -z "${avdmanager_bin}" ]]; then
            avdmanager_bin="$(find "${android_home}/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [[ -z "${sdkmanager_bin}" || ! -x "${sdkmanager_bin}" ]]; then
            echo "ERROR: sdkmanager not found." >&2
            exit 1
          fi
          if [[ -z "${avdmanager_bin}" || ! -x "${avdmanager_bin}" ]]; then
            echo "ERROR: avdmanager not found." >&2
            exit 1
          fi

          system_image="system-images;android-${API_LEVEL};google_apis;x86_64"
          yes | "${sdkmanager_bin}" --licenses >/dev/null || true
          "${sdkmanager_bin}" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "${system_image}"

          avd_name="passwdgen-api-${API_LEVEL}"
          avd_home="${RUNNER_TEMP}/android-avd-api-${API_LEVEL}"
          mkdir -p "${avd_home}"
          printf 'no\n' | ANDROID_AVD_HOME="${avd_home}" "${avdmanager_bin}" create avd \
            --force \
            --name "${avd_name}" \
            --package "${system_image}"

          ANDROID_AVD_HOME="${avd_home}" "${android_home}/emulator/emulator" -list-avds \
            | tee "${RUNNER_TEMP}/avd-list-api-${API_LEVEL}.txt" \
            | grep -Fxq "${avd_name}"

          echo "android_home=${android_home}" >> "${GITHUB_OUTPUT}"
          echo "adb=${android_home}/platform-tools/adb" >> "${GITHUB_OUTPUT}"
          echo "emulator=${android_home}/emulator/emulator" >> "${GITHUB_OUTPUT}"
          echo "avd_name=${avd_name}" >> "${GITHUB_OUTPUT}"
          echo "avd_home=${avd_home}" >> "${GITHUB_OUTPUT}"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Start emulator
        shell: bash
        env:
          ADB: ${{ steps.android-sdk.outputs.adb }}
          EMULATOR: ${{ steps.android-sdk.outputs.emulator }}
          AVD_NAME: ${{ steps.android-sdk.outputs.avd_name }}
          ANDROID_AVD_HOME: ${{ steps.android-sdk.outputs.avd_home }}
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          set -euo pipefail
          emulator_log="${RUNNER_TEMP}/emulator-api-${API_LEVEL}.log"
          acceleration_log="${RUNNER_TEMP}/emulator-acceleration-api-${API_LEVEL}.log"

          if [[ ! -e /dev/kvm ]]; then
            echo "ERROR: /dev/kvm is unavailable on this runner." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          "${EMULATOR}" -accel-check | tee "${acceleration_log}"
          "${EMULATOR}" -list-avds | tee "${RUNNER_TEMP}/avd-list-before-start-api-${API_LEVEL}.txt" \
            | grep -Fxq "${AVD_NAME}"

          nohup "${EMULATOR}" \
            -avd "${AVD_NAME}" \
            -accel on \
            -cores 2 \
            -memory 2048 \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -camera-back none \
            -camera-front none \
            -wipe-data \
            > "${emulator_log}" 2>&1 &
          emulator_pid=$!
          printf '%s\n' "${emulator_pid}" > "${RUNNER_TEMP}/emulator-api-${API_LEVEL}.pid"

          if ! timeout 180 "${ADB}" wait-for-device; then
            echo "ERROR: emulator did not appear in ADB within 180 seconds." >&2
            tail -n 200 "${emulator_log}" >&2 || true
            kill "${emulator_pid}" || true
            exit 1
          fi

          deadline=$((SECONDS + 300))
          until [[ "$("${ADB}" shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; do
            if (( SECONDS >= deadline )); then
              echo "ERROR: emulator did not finish booting within 300 seconds after ADB connection." >&2
              tail -n 200 "${emulator_log}" >&2 || true
              exit 1
            fi
            sleep 5
          done

          "${ADB}" shell settings put global device_provisioned 1 || true
          "${ADB}" shell settings put secure user_setup_complete 1 || true
          "${ADB}" shell pm disable-user --user 0 com.google.android.setupwizard || true
          "${ADB}" shell input keyevent 82 || true

      - name: Run launch smoke test
        shell: bash
        env:
          ADB: ${{ steps.android-sdk.outputs.adb }}
          EXPECTED_API: ${{ matrix.api-level }}
          ARTIFACT_DIR: app/build/emulator-smoke/api-${{ matrix.api-level }}
        run: |
          set -euo pipefail
          bash scripts/emulator-smoke.sh

      - name: Stop emulator
        if: always()
        shell: bash
        env:
          ADB: ${{ steps.android-sdk.outputs.adb }}
        run: |
          "${ADB}" emu kill || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: emulator-smoke-api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/emulator-smoke/**
            ${{ runner.temp }}/emulator-api-${{ matrix.api-level }}.log
            ${{ runner.temp }}/emulator-acceleration-api-${{ matrix.api-level }}.log
            ${{ runner.temp }}/avd-list-api-${{ matrix.api-level }}.txt
            ${{ runner.temp }}/avd-list-before-start-api-${{ matrix.api-level }}.txt
