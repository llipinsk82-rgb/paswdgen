name: Android OTA candidate

on:
  push:
    branches: [agent/android-vault-mvp]
    paths:
      - app/**
      - .github/workflows/android-ota-candidate.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: android-ota-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build signed OTA bridge candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SIGNER_SHA256: "4bbe62f2bad5733fcc1585ed6fe437bedeb181ffb3637a0a067138d2131c90b1"
      EXPECTED_VERSION_CODE: "12"
      EXPECTED_VERSION_NAME: "0.1.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_bin}" ]]; then
            sdkmanager_bin="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "${sdkmanager_bin}"
          yes | "${sdkmanager_bin}" --licenses >/dev/null || true
          "${sdkmanager_bin}" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            platform-tools

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check --strict
          grep -Fx "distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78" \
            gradle/wrapper/gradle-wrapper.properties

      - name: Restore protected signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"

          umask 077
          keystore_file="${RUNNER_TEMP}/passwdgen-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_file}"
          test -s "${keystore_file}"

          echo "ANDROID_KEYSTORE_FILE=${keystore_file}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Test and build signed candidate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest lintRelease assembleRelease

      - name: Verify candidate package and signer
        shell: bash
        run: |
          set -euo pipefail
          build_tools="${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          analyzer="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/apkanalyzer"
          source_apk="app/build/outputs/apk/release/app-release.apk"
          candidate_dir="${RUNNER_TEMP}/ota-candidate"
          candidate_apk="${candidate_dir}/PasswdGen-OTA-Bridge-v${EXPECTED_VERSION_NAME}-vc${EXPECTED_VERSION_CODE}.apk"
          verification="${RUNNER_TEMP}/ota-candidate-apksigner.txt"
          mkdir -p "${candidate_dir}"
          cp "${source_apk}" "${candidate_apk}"

          "${build_tools}/apksigner" verify --verbose --print-certs "${candidate_apk}" \
            > "${verification}" 2>&1
          cat "${verification}"
          grep -Eq '^Verified using v3 scheme .*: true$' "${verification}"

          package_id="$("${analyzer}" manifest application-id "${candidate_apk}" | tr -d '\r\n')"
          version_code="$("${analyzer}" manifest version-code "${candidate_apk}" | tr -d '\r\n')"
          version_name="$("${analyzer}" manifest version-name "${candidate_apk}" | tr -d '\r\n')"
          signer="$(grep -Eim1 'certificate SHA-256 digest:' "${verification}" \
            | sed -E 's/^.*digest:[[:space:]]*//' \
            | tr -d '[:space:]:' \
            | tr '[:upper:]' '[:lower:]')"
          expected_signer="$(printf '%s' "${EXPECTED_SIGNER_SHA256}" \
            | tr -d '[:space:]:' \
            | tr '[:upper:]' '[:lower:]')"
          apk_sha256="$(sha256sum "${candidate_apk}" | awk '{print $1}')"

          test "${package_id}" = "com.blackserv.passwdgen"
          test "${version_code}" = "${EXPECTED_VERSION_CODE}"
          test "${version_name}" = "${EXPECTED_VERSION_NAME}"
          test "${signer}" = "${expected_signer}"

          cat > "${candidate_dir}/VERIFY.txt" <<EOF
          PasswdGen signed OTA bridge candidate
          HEAD=${GITHUB_SHA}
          packageId=${package_id}
          versionCode=${version_code}
          versionName=${version_name}
          signerCertificateSha256=${signer}
          signatureScheme=v3
          apkSha256=${apk_sha256}
          manualBridgeInstall=true
          releasePublished=false
          tagCreated=false
          EOF

          cat > "${candidate_dir}/README-TEST.txt" <<'EOF'
          1. Install the bridge APK over the existing production-signed versionCode 11.
          2. Confirm Android treats it as an update and all vault records remain readable.
          3. Confirm the top-right update icon is visible.
          4. Tap it before any newer GitHub Release exists and confirm the app reports that the latest version is installed.
          5. Do not uninstall the app and do not clear its data.
          6. Wait for the v0.1.3 / versionCode 13 OTA release instructions.
          EOF

          cat "${candidate_dir}/VERIFY.txt"

      - name: Upload signed OTA bridge candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: passwdgen-signed-ota-bridge-v0.1.2
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/ota-candidate/

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/passwdgen-release.jks"

      - name: Report result to Issue 6
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${JOB_STATUS}" == "success" ]]; then
            result="PASS — signed v0.1.2 / versionCode 12 OTA bridge built and verified. No tag or Release was created."
          else
            result="FAIL — OTA bridge candidate was not completed. No tag or Release was created."
          fi

          comment_file="${RUNNER_TEMP}/ota-candidate-comment.md"
          cat > "${comment_file}" <<EOF
          ### Signed OTA bridge candidate

          - Result: **${result}**
          - HEAD: \`${HEAD_SHA}\`
          - Run: ${RUN_URL}
          - Candidate: \`0.1.2 / versionCode 12\`
          - Artifact: \`passwdgen-signed-ota-bridge-v0.1.2\` (success only)
          - Production release/tag created: **no**
          EOF
          gh issue comment 6 --body-file "${comment_file}"
