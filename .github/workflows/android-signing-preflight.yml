name: Android signing preflight

on:
  push:
    branches: [agent/android-vault-mvp]
    paths:
      - .github/workflows/android-signing-preflight.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: android-signing-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-preflight:
    name: Validate protected Android signing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SIGNER_SHA256: "4bbe62f2bad5733fcc1585ed6fe437bedeb181ffb3637a0a067138d2131c90b1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_bin}" ]]; then
            sdkmanager_bin="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "${sdkmanager_bin}"
          yes | "${sdkmanager_bin}" --licenses >/dev/null || true
          "${sdkmanager_bin}" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            platform-tools

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check --strict
          grep -Fx "distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78" \
            gradle/wrapper/gradle-wrapper.properties

      - name: Restore protected signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"

          umask 077
          keystore_file="${RUNNER_TEMP}/passwdgen-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_file}"
          test -s "${keystore_file}"

          echo "ANDROID_KEYSTORE_FILE=${keystore_file}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest lintRelease assembleRelease \
            -Ppasswdgen.versionCode=700001 \
            -Ppasswdgen.versionName=0.1.0-signing-preflight

      - name: Verify signed package and pinned certificate
        shell: bash
        run: |
          set -euo pipefail
          build_tools="${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          apk="app/build/outputs/apk/release/app-release.apk"
          report_dir="${RUNNER_TEMP}/signing-preflight-report"
          verification="${RUNNER_TEMP}/apksigner-verification.txt"
          mkdir -p "${report_dir}"
          test -s "${apk}"

          "${build_tools}/apksigner" verify --verbose --print-certs "${apk}" > "${verification}"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "${verification}"

          package_id="$("${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "${apk}")"
          version_code="$("${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "${apk}")"
          version_name="$("${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "${apk}")"
          signer_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${verification}" | head -n 1 | tr '[:upper:]' '[:lower:]')"
          expected_sha256="$(printf '%s' "${EXPECTED_SIGNER_SHA256}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          apk_sha256="$(sha256sum "${apk}" | awk '{print $1}')"

          test "${package_id}" = "com.blackserv.passwdgen"
          test "${version_code}" = "700001"
          test -n "${signer_sha256}"
          if [[ "${signer_sha256}" != "${expected_sha256}" ]]; then
            echo "Signer certificate mismatch." >&2
            echo "Expected: ${expected_sha256}" >&2
            echo "Actual:   ${signer_sha256}" >&2
            exit 1
          fi

          {
            echo "result=PASS"
            echo "packageId=${package_id}"
            echo "versionCode=${version_code}"
            echo "versionName=${version_name}"
            echo "expectedSignerCertificateSha256=${expected_sha256}"
            echo "signerCertificateSha256=${signer_sha256}"
            echo "apkSha256=${apk_sha256}"
            echo "apkPublished=false"
          } | tee "${report_dir}/signing-preflight.txt"

      - name: Upload safe signing report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-signing-preflight-report
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/signing-preflight-report/signing-preflight.txt

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/passwdgen-release.jks"

      - name: Report safe result to Issue 6
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${JOB_STATUS}" == "success" ]]; then
            result="PASS — protected key restored, release APK built, signature verified and certificate matched the pinned production fingerprint. APK was not published."
          else
            result="FAIL — preflight stopped before publication. Review the linked Actions log; no APK was published."
          fi

          comment_file="${RUNNER_TEMP}/signing-preflight-comment.md"
          cat > "${comment_file}" <<EOF
          ### Android signing preflight

          - Result: **${result}**
          - HEAD: \`${HEAD_SHA}\`
          - Run: ${RUN_URL}
          - Pinned certificate SHA-256: \`${EXPECTED_SIGNER_SHA256}\`
          - Safe artifact: \`android-signing-preflight-report\` (success only)
          - Production release/tag created: **no**
          EOF
          gh issue comment 6 --body-file "${comment_file}"
