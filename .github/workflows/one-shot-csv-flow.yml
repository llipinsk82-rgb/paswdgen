name: One-shot CSV flow integration

on:
  push:
    branches:
      - agent/android-vault-mvp
    paths:
      - ops/run-csv-flow

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-vault-mvp
          fetch-depth: 0

      - name: Integrate CSV and file flows
        run: |
          set -euo pipefail
          python3 scripts/patch-csv-flow-integration.py
          git diff --check

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "blackserv-migration-bot"
          git config user.email "blackserv-migration-bot@users.noreply.github.com"
          git add app/src/main/java/com/blackserv/passwdgen/AppUi.kt app/src/main/java/com/blackserv/passwdgen/BackupUi.kt
          git commit -m "feat: integrate protected CSV migration flows"
          git push origin HEAD:agent/android-vault-mvp
