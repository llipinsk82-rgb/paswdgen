name: One-shot source correction

on:
  push:
    branches:
      - agent/android-vault-mvp

permissions:
  contents: write

jobs:
  fix-import:
    if: github.repository == 'llipinsk82-rgb/paswdgen'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-vault-mvp
          fetch-depth: 0

      - name: Remove invalid Compose import
        shell: bash
        run: |
          set -euo pipefail
          file='app/src/main/java/com/blackserv/passwdgen/AppUi.kt'
          grep -Fxq 'import androidx.compose.foundation.layout.weight' "${file}"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "${file}"

          git diff --check
          changed="$(git diff --name-only)"
          if [[ "${changed}" != "${file}" ]]; then
            echo "ERROR: unexpected changed paths: ${changed}" >&2
            exit 1
          fi

          git config user.name 'BlackServ CTO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "${file}"
          git commit -m 'fix: remove invalid Compose weight import'
          git push origin HEAD:agent/android-vault-mvp
