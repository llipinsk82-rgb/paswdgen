name: One-shot premium UI integration

on:
  push:
    branches: [agent/android-vault-mvp]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-vault-mvp
          fetch-depth: 0
      - name: Integrate premium layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          premium = Path('app/src/main/java/com/blackserv/passwdgen/PremiumUi.kt')
          p = premium.read_text()
          p = p.replace(
              'import androidx.compose.foundation.layout.Column\n',
              'import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.ColumnScope\n',
          )
          p = p.replace('content: @Composable Column.() -> Unit', 'content: @Composable ColumnScope.() -> Unit')
          premium.write_text(p)

          ui = Path('app/src/main/java/com/blackserv/passwdgen/AppUi.kt')
          s = ui.read_text()
          start = s.index('@Composable\nprivate fun GeneratorScreen(')
          end = s.index('private fun strengthLabel(', start)
          replacement = '''@Composable
          private fun GeneratorScreen(
              state: AppUiState,
              onOptionsChange: ((PasswordOptions) -> PasswordOptions) -> Unit,
              onGenerate: () -> Unit,
              onMessage: (String) -> Unit,
              modifier: Modifier = Modifier,
          ) {
              val context = LocalContext.current
              Column(
                  modifier = modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(horizontal = 14.dp, vertical = 10.dp),
              ) {
                  PremiumGeneratorContent(
                      state = state,
                      onOptionsChange = onOptionsChange,
                      onGenerate = onGenerate,
                      onCopy = {
                          copySensitive(context, state.generated.value)
                          onMessage("Hasło skopiowane. Schowek wyczyści się po 60 sekundach.")
                      },
                  )
                  Spacer(Modifier.height(14.dp))
              }
          }

          '''
          s = s[:start] + replacement + s[end:]
          s = s.replace('topBar = { TopAppBar(title = { Text("PasswdGen · Secure Vault") }) },',
                        'topBar = { TopAppBar(title = { Text("PasswdGen") }) },')
          s = s.replace('CompactVaultEntryCard(', 'PremiumVaultRow(')
          ui.write_text(s)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('applicationIdSuffix = ".debug"', 'applicationIdSuffix = ".preview2"')
          g = g.replace('versionNameSuffix = "-debug"', 'versionNameSuffix = "-preview2"')
          gradle.write_text(g)
          PY
          git diff --check
          git config user.name 'BlackServ CTO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/blackserv/passwdgen/PremiumUi.kt app/src/main/java/com/blackserv/passwdgen/AppUi.kt app/build.gradle.kts
          git commit -m 'feat: integrate premium layout and preview package'
          git push origin HEAD:agent/android-vault-mvp
