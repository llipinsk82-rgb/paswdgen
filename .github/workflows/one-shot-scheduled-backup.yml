name: One-shot scheduled backup integration

on:
  push:
    branches:
      - agent/android-vault-mvp
    paths:
      - ops/run-scheduled-backup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-vault-mvp
          fetch-depth: 0

      - name: Apply scheduled backup integration
        run: |
          set -euo pipefail
          python3 scripts/patch-scheduled-backup-integration.py
          git diff --check

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "blackserv-backup-bot"
          git config user.email "blackserv-backup-bot@users.noreply.github.com"
          git add app gradle
          git commit -m "feat: add weekly encrypted cloud backups"
          git push origin HEAD:agent/android-vault-mvp
