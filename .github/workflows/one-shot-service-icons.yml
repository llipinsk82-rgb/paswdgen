name: One-shot service icons

on:
  push:
    branches:
      - agent/android-vault-mvp
    paths:
      - ops/run-service-icons

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-vault-mvp
          fetch-depth: 0

      - name: Connect service icons to vault rows
        run: |
          set -euo pipefail
          python3 scripts/patch-service-brand-ui.py
          git diff --check

      - name: Commit UI integration
        run: |
          set -euo pipefail
          git config user.name "blackserv-ui-bot"
          git config user.email "blackserv-ui-bot@users.noreply.github.com"
          git add app/src/main/java/com/blackserv/passwdgen/PremiumUi.kt
          git commit -m "feat: show offline service icons in vault"
          git push origin HEAD:agent/android-vault-mvp
