name: One-shot UI refresh

on:
  push:
    branches: [agent/android-vault-mvp]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'llipinsk82-rgb/paswdgen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-vault-mvp
          fetch-depth: 0
      - name: Refresh generator UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/blackserv/passwdgen/AppUi.kt')
          s = p.read_text()
          s = s.replace('topBar = { TopAppBar(title = { Text("PasswdGen") }) },', 'topBar = { TopAppBar(title = { Text("PasswdGen · Secure Vault") }) },')
          old = '''        Text("Długość: ${state.options.length}", style = MaterialTheme.typography.titleMedium)
        Slider(
            value = state.options.length.toFloat(),
            onValueChange = { value ->
                onOptionsChange { it.copy(length = value.toInt().coerceIn(8, 128)) }
            },
            valueRange = 8f..128f,
            steps = 119,
        )'''
          new = '''        Text("Długość hasła", style = MaterialTheme.typography.titleMedium)
        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
            listOf(12, 16, 20, 24, 32).forEach { preset ->
                if (state.options.length == preset) {
                    Button(onClick = { onOptionsChange { it.copy(length = preset) } }) { Text("$preset") }
                } else {
                    OutlinedButton(onClick = { onOptionsChange { it.copy(length = preset) } }) { Text("$preset") }
                }
            }
        }
        Text("${state.options.length} znaków · zalecane 16–20")
        Slider(
            value = state.options.length.toFloat(),
            onValueChange = { value ->
                onOptionsChange { it.copy(length = value.toInt().coerceIn(PasswordGenerator.MIN_LENGTH, PasswordGenerator.MAX_LENGTH)) }
            },
            valueRange = PasswordGenerator.MIN_LENGTH.toFloat()..PasswordGenerator.MAX_LENGTH.toFloat(),
            steps = PasswordGenerator.MAX_LENGTH - PasswordGenerator.MIN_LENGTH - 1,
        )'''
          if old not in s:
              raise SystemExit('length block not found')
          s = s.replace(old, new)
          s = s.replace('label = { Text("Szukaj lokalnie") },', 'label = { Text("Szukaj po nazwie, domenie lub loginie") },')
          s = s.replace('Text("Login: ${entry.username}")', 'Text(entry.username, style = MaterialTheme.typography.bodyLarge)')
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'BlackServ CTO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/blackserv/passwdgen/AppUi.kt
          git commit -m 'feat: refresh generator and vault experience'
          git push origin HEAD:agent/android-vault-mvp
