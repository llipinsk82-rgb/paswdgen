name: One-shot vault layout fix

on:
  push:
    branches:
      - agent/android-vault-mvp
    paths:
      - ops/run-vault-layout-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-vault-mvp
          fetch-depth: 0

      - name: Apply vault layout fix
        run: |
          set -euo pipefail
          python3 scripts/patch-vault-visible-entries.py
          git diff --check

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "blackserv-layout-bot"
          git config user.email "blackserv-layout-bot@users.noreply.github.com"
          git add app/src/main/java/com/blackserv/passwdgen/AppUi.kt
          git commit -m "fix: keep restored vault entries visible"
          git push origin HEAD:agent/android-vault-mvp
