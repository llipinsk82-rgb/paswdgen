name: One-shot verified wrapper commit

on:
  push:
    branches:
      - agent/android-vault-mvp

permissions:
  contents: write

jobs:
  commit-wrapper:
    if: github.repository == 'llipinsk82-rgb/paswdgen'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-vault-mvp
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate, verify and commit wrapper
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap-gradle-wrapper.sh

          expected_jar='81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f'
          actual_jar="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          [[ "${actual_jar}" == "${expected_jar}" ]]

          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all \
              | sed 's/^...//' \
              | sort
          )
          expected=(
            'gradle/wrapper/gradle-wrapper.jar'
            'gradle/wrapper/gradle-wrapper.properties'
            'gradlew'
            'gradlew.bat'
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'ERROR: unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

          git diff --check
          git config user.name 'BlackServ CTO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'build: add verified Gradle Wrapper 8.13'
          git push origin HEAD:agent/android-vault-mvp
