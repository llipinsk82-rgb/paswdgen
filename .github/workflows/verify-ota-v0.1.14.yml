name: Verify OTA v0.1.14

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-ota-v0.1.14.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.14
    steps:
      - name: Verify release assets and manifest
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          update_json="$(mktemp)"
          apk_file="$(mktemp)"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "${release_json}"

          update_id="$(jq -r '.assets[] | select(.name == "update.json") | .id' "${release_json}")"
          apk_id="$(jq -r '.assets[] | select(.name == "PasswdGen-release.apk") | .id' "${release_json}")"
          apk_size="$(jq -r '.assets[] | select(.name == "PasswdGen-release.apk") | .size' "${release_json}")"

          test -n "${update_id}"
          test -n "${apk_id}"
          test "${apk_size}" -gt 0

          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${update_id}" > "${update_json}"
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${apk_id}" > "${apk_file}"

          test "$(jq -r '.versionCode' "${update_json}")" = "24"
          test "$(jq -r '.versionName' "${update_json}")" = "0.1.14"
          test "$(jq -r '.apkUrl' "${update_json}")" = \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/PasswdGen-release.apk"

          expected_sha="$(jq -r '.sha256' "${update_json}")"
          actual_sha="$(sha256sum "${apk_file}" | awk '{print $1}')"
          test "${expected_sha}" = "${actual_sha}"
          test "${expected_sha}" != "null"
          test "${#expected_sha}" -eq 64

          echo "OTA ${RELEASE_TAG} verified"
          echo "APK size: ${apk_size} bytes"
          echo "APK SHA-256: ${actual_sha}"
